<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Importer - Dynamic Database Import</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .upload-area {
            border: 2px dashed #007bff;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: #0056b3;
            background: #e3f2fd;
        }
        .upload-area.dragover {
            border-color: #28a745;
            background: #d4edda;
        }
        .result-card {
            margin-top: 20px;
            display: none;
        }
        .table-container {
            max-height: 400px;
            overflow-y: auto;
        }
        .loading {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0"><i class="fas fa-file-excel"></i> Excel Importer</h3>
                        <small>Dynamic Database Import System</small>
                    </div>
                    <div class="card-body">
                        <!-- Upload Form -->
                        <!-- Database Configuration -->
                        <div class="card mb-4">
                            <div class="card-header">
                                <h6 class="mb-0">
                                    <i class="fas fa-database"></i> Database Configuration
                                    <button class="btn btn-sm btn-outline-secondary float-end" type="button" data-bs-toggle="collapse" data-bs-target="#configSection">
                                        <i class="fas fa-cog"></i> Configure
                                    </button>
                                </h6>
                            </div>
                            <div class="collapse" id="configSection">
                                <div class="card-body">
                                    <form id="configForm">
                                        <div class="row">
                                            <div class="col-md-3">
                                                <label class="form-label">Host</label>
                                                <input type="text" class="form-control" id="dbHost" value="localhost">
                                            </div>
                                            <div class="col-md-2">
                                                <label class="form-label">Port</label>
                                                <input type="text" class="form-control" id="dbPort" value="5432">
                                            </div>
                                            <div class="col-md-3">
                                                <label class="form-label">Username</label>
                                                <input type="text" class="form-control" id="dbUsername" value="postgres">
                                            </div>
                                            <div class="col-md-4">
                                                <label class="form-label">Password</label>
                                                <input type="password" class="form-control" id="dbPassword">
                                            </div>
                                        </div>
                                        <div class="mt-3">
                                            <button type="button" class="btn btn-primary" id="saveConfigBtn">
                                                <i class="fas fa-save"></i> Save Configuration
                                            </button>
                                            <button type="button" class="btn btn-secondary" id="loadConfigBtn">
                                                <i class="fas fa-sync"></i> Load Current
                                            </button>
                                            <button type="button" class="btn btn-success" id="testConnectionBtn">
                                                <i class="fas fa-plug"></i> Test Connection
                                            </button>
                                            <button type="button" class="btn btn-info" id="loadDatabasesBtn">
                                                <i class="fas fa-database"></i> Load Databases
                                            </button>
                                        </div>
                                        <div class="mt-2">
                                            <select class="form-select" id="databaseSelect" style="display:none;">
                                                <option value="">Select Database...</option>
                                            </select>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <form id="uploadForm">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Database Name</label>
                                    <input type="text" class="form-control" id="databaseName" value="company_management" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Table Name</label>
                                    <input type="text" class="form-control" id="tableName" placeholder="e.g., departments" required>
                                </div>
                            </div>
                            
                            <div class="upload-area" id="uploadArea">
                                <i class="fas fa-cloud-upload-alt fa-3x text-primary mb-3"></i>
                                <h5>Drag & Drop Excel File Here</h5>
                                <p class="text-muted">or click to browse (.xlsx, .xls files only)</p>
                                <input type="file" class="form-control d-none" id="fileInput" accept=".xlsx,.xls" multiple="false">
                                <button type="button" class="btn btn-outline-primary" id="browseBtn">
                                    <i class="fas fa-folder-open"></i> Browse Files
                                </button>
                            </div>
                            
                            <div class="mt-3 d-none" id="fileInfo">
                                <div class="alert alert-info d-flex justify-content-between align-items-center">
                                    <div>
                                        <i class="fas fa-file"></i> <span id="fileName"></span>
                                    </div>
                                    <button type="button" class="btn btn-sm btn-outline-danger" id="removeFileBtn">
                                        <i class="fas fa-times"></i> Remove
                                    </button>
                                </div>
                            </div>
                            
                            <div class="mt-3">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="fas fa-upload"></i> Import Excel Data
                                </button>
                                <button type="button" class="btn btn-info btn-lg ms-2" id="viewDataBtn">
                                    <i class="fas fa-eye"></i> View Table Data
                                </button>
                            </div>
                        </form>
                        
                        <!-- Loading -->
                        <div class="loading text-center mt-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2">Processing...</p>
                        </div>
                        
                        <!-- Results -->
                        <div class="result-card" id="resultCard">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="mb-0">Import Results</h5>
                                </div>
                                <div class="card-body" id="resultContent"></div>
                            </div>
                        </div>
                        
                        <!-- Data View -->
                        <div class="result-card" id="dataCard">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="mb-0">Table Data</h5>
                                </div>
                                <div class="card-body">
                                    <div class="table-container">
                                        <table class="table table-striped" id="dataTable">
                                            <thead></thead>
                                            <tbody></tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
